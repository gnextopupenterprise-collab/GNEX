<VirtualHost *:80>
    ServerName gnexcenter.com
    ServerAlias www.gnexcenter.com

    DocumentRoot /var/www/gnex-main

    <Directory /var/www/gnex-main>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/gnex-main/data>
        Require all denied
    </Directory>

    <FilesMatch "^(scrim-(?:db|password|push)-config|order-record-sheet-config)\.php$">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/gnex-main-error.log
    CustomLog ${APACHE_LOG_DIR}/gnex-main-access.log combined
</VirtualHost>
